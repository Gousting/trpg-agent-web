<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COC TRPG 跑团 · 快捷入口</title>
<style>
  :root {
    --bg: #17120f; --panel: #231a14; --border: rgba(210,179,124,0.28); --gold: #d4af37;
    --text: #e8e0d0; --muted: #a0906f; --accent: #8b6f47;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:
      radial-gradient(circle at 50% -6%, #3a2b22 0%, #1f1813 42%, #120f0c 100%);
    color: var(--text); font-family: "Noto Serif SC", "Microsoft YaHei", serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding: 24px 0;
  }
  .card {
    width: 480px; max-width: 92vw;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 30%),
      linear-gradient(180deg, #2b2017 0%, #231a14 60%, #1c1510 100%);
    border:1px solid rgba(210,179,124,0.35); border-radius:14px; padding:36px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.4) inset; position:relative;
  }
  .card::before {
    content:""; position:absolute; top:0; left:24px; right:24px; height:2px;
    background: linear-gradient(90deg, transparent, rgba(200,158,86,0.7) 18%, rgba(212,175,55,0.9) 50%, rgba(200,158,86,0.7) 82%, transparent);
    border-radius:2px; pointer-events:none;
  }
  .card::after {
    content:""; position:absolute; inset:8px; border:1px solid rgba(210,179,124,0.12);
    border-radius:8px; pointer-events:none;
  }
  h1 { font-size:24px; letter-spacing:4px; color:var(--gold); text-align:center; margin-bottom:4px; text-shadow: 0 2px 12px rgba(212,175,55,0.25); }
  .sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:28px; letter-spacing:1px; }
  .field { margin-bottom:18px; }
  .field label { display:block; font-size:13px; color:#c9b48a; margin-bottom:6px; letter-spacing:1px; }
  .field input, .field select {
    width:100%; padding:11px 14px; background:rgba(12,9,7,0.55); color:var(--text);
    border:1px solid rgba(210,179,124,0.25); border-radius:8px; font-size:14px; outline:none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus { border-color:var(--gold); box-shadow: 0 0 0 2px rgba(212,175,55,0.15); }
  .fixed-row {
    display:flex; align-items:center; gap:10px; background:rgba(12,9,7,0.55);
    border:1px dashed rgba(210,179,124,0.28); border-radius:8px; padding:10px 12px; font-size:12px;
    color:var(--muted);
  }
  .fixed-row code { color:var(--gold); font-size:12px; }
  .checks { display:flex; gap:20px; margin-top:4px; }
  .checks label { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; }
  .checks input { accent-color:var(--gold); width:15px; height:15px; }
  #btn-start {
    width:100%; margin-top:8px; padding:15px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 45%),
      linear-gradient(180deg, #8a6a3d 0%, #6b4f2b 55%, #5a4022 100%);
    color:#f5e6c4; font-size:17px; font-weight:700; letter-spacing:6px; border:none; border-radius:10px;
    border:1px solid rgba(212,175,55,0.45);
    box-shadow: 0 4px 18px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.35) inset, 0 1px 0 rgba(255,255,255,0.12) inset;
    cursor:pointer; transition:filter .2s, transform .1s;
  }
  #btn-start:hover { filter:brightness(1.18); box-shadow: 0 6px 24px rgba(212,175,55,0.2), 0 0 0 1px rgba(0,0,0,0.35) inset; }
  #btn-start:active { transform:scale(.98); }
  #btn-start:disabled { opacity:.5; cursor:not-allowed; }
  #status { margin-top:16px; text-align:center; font-size:13px; color:var(--muted); min-height:18px; }
  .err { color:#e07a6a !important; }
  .hint { margin-top:14px; font-size:11px; color:var(--muted); text-align:center; line-height:1.7; }
  .hint a { color:var(--gold); text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <h1>✦ 开始游戏 ✦</h1>
  <div class="sub">快捷入口 · KP 与 NPC 均由 deepseek-v4-flash 扮演</div>

  <div class="field">
    <label>API Key（必填，仅本次使用，不落盘）</label>
    <input id="api-key" type="password" placeholder="sk-..." autocomplete="off">
  </div>

  <div class="fixed-row">
    <span>KP / NPC 模型</span>
    <code>deepseek-v4-flash @ opencode.ai/zen/go/v1</code>
  </div>

  <div class="field" style="margin-top:18px">
    <label>世界观</label>
    <select id="world">
      <option value="infinite_flow">无限流（咒怨 / 生化 / 修仙）</option>
      <option value="coc">克苏鲁 COC</option>
      <option value="harry_potter">哈利波特</option>
    </select>
  </div>

  <div class="field">
    <label>模式</label>
    <select id="mode">
      <option value="ai">AI 自动（KP 与角色全 AI 操作）</option>
      <option value="human">人类玩家（你扮演调查员）</option>
      <option value="live">直播互动（观众投票推动剧情）</option>
    </select>
  </div>

  <div class="field">
    <label>回合数</label>
    <input id="turns" type="number" value="12" min="1" max="200">
  </div>

  <button id="btn-start" onclick="startEntry()">开始游戏</button>
  <div id="status"></div>
  <div class="hint">配置由入口页固定，仅需填入 API Key。<br>点击开始后直接进入游戏。</div>
</div>

<script>
const FIXED_HOST = 'https://opencode.ai/zen/go/v1';
const FIXED_MODEL = 'deepseek-v4-flash';

function startEntry() {
  const key = document.getElementById('api-key').value.trim();
  const status = document.getElementById('status');
  const btn = document.getElementById('btn-start');
  if (!key) { status.textContent = '请先填入 API Key'; status.classList.add('err'); return; }
  status.classList.remove('err');
  btn.disabled = true;
  status.textContent = '正在启动...';

  const cfg = {
    host: FIXED_HOST,
    kp: FIXED_MODEL,
    player: FIXED_MODEL,
    player_host: FIXED_HOST,
    kp_api_key: key,
    world: document.getElementById('world').value,
    mode: document.getElementById('mode').value,
    turns: parseInt(document.getElementById('turns').value) || 12,
    compose_modules: true,
    load_profile: false,
  };
  sessionStorage.setItem('entry_cfg', JSON.stringify(cfg));
  // v=时间戳：强制绕过浏览器/CF 对 index.html 的缓存（旧版 EventSource 会卡死）
  location.href = '/index.html?entry=1&v=' + Date.now();
}
</script>
</body>
</html>

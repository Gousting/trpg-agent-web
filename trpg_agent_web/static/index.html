<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRPG Roguelike 跑团</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111;
    --border: #1f1f1f;
    --text: #b0a89a;
    --text-dim: #665;
    --accent: #8b0000;
    --gold: #8a7a50;
    --kp-color: #b8a080;
    --player-blue: #4a90d9;
    --player-green: #50c878;
    --player-orange: #e07050;
    --bubble-bg: rgba(20,16,12,0.92);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #000;
    color: var(--text);
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif;
    height: 100vh; display: grid;
    grid-template-columns: 4fr 3fr 3fr;
    grid-template-rows: 36px 1fr auto;
    overflow: hidden;
  }

  /* ═══ 顶部控制栏 ═══ */
  #controls {
    grid-column: 1 / -1; grid-row: 1;
    background: #0d0d0d; border-bottom: 1px solid #1a1a1a;
    padding: 0 12px; display: flex; align-items: center; gap: 8px;
    font-size: 11px; z-index: 10;
  }
  #controls button {
    background: var(--accent); color: #ddd; border: none;
    padding: 4px 14px; font-size: 11px; cursor: pointer;
    font-family: inherit; letter-spacing: 1px;
  }
  #controls button:disabled { opacity: 0.35; }
  #controls label { color: #555; font-size: 10px; }
  #controls input, #controls select {
    background: #1a1a1a; border: 1px solid #222; color: #999;
    padding: 3px 6px; font-size: 10px; font-family: inherit;
  }
  #status { font-size: 10px; color: #555; margin-left: auto; }

  /* ═══ 左侧：场景背景 ═══ */
  #scene {
    grid-column: 1; grid-row: 2;
    position: relative; background: #080808;
    border-right: 1px solid #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #scene-img {
    width: 100%; height: 100%; object-fit: cover;
    filter: sepia(0.15) brightness(0.7) saturate(0.6);
  }
  #scene-label {
    position: absolute; bottom: 10px; left: 10px;
    font-size: 11px; color: #665; letter-spacing: 2px;
  }
  #scene-mood {
    position: absolute; bottom: 10px; right: 10px;
    font-size: 10px; color: #554;
    display: flex; align-items: center; gap: 4px;
  }
  #scene-mood::before {
    content: ''; display: inline-block;
    width: 5px; height: 5px; background: #8b0000; border-radius: 50%;
  }

  /* ═══ 中间：对话叙事区 ═══ */
  #narrative {
    grid-column: 2; grid-row: 2;
    display: flex; flex-direction: column;
    background: #0c0c0c;
    border-right: 1px solid #1a1a1a;
    overflow: hidden;
  }
  #room-header {
    padding: 10px 14px; border-bottom: 1px solid #181818;
    font-size: 10px; color: #555; flex-shrink: 0;
    display: flex; gap: 16px;
  }
  #room-header span { color: #8a7a50; }
  #chat {
    flex: 1; overflow-y: auto; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 95%; animation: fadeIn 0.5s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .msg-header { font-size: 9px; font-weight: bold; margin-bottom: 2px; opacity: 0.55; letter-spacing: 1px; }
  .msg-body { font-size: 12.5px; line-height: 1.75; padding: 10px 14px; border-radius: 4px; }

  /* KP 旁白 — 引用条风格 */
  .msg-kp .msg-body {
    background: transparent; border: none; border-left: 2px solid #3a3020;
    padding: 4px 0 4px 12px; color: #aaa;
  }
  /* 玩家发言 */
  .msg-player .msg-body {
    background: rgba(20,18,14,0.6); border: 1px solid #1f1f1f;
    border-left: 2px solid var(--player-color, #555);
  }
  /* 系统消息 */
  .msg-system {
    align-self: center; font-size: 10px; color: #554;
    padding: 2px 8px; animation: fadeIn 0.5s ease;
  }
  .msg-item {
    align-self: center; background: #0a1a0a; border: 1px solid #1a3a1a;
    border-radius: 4px; padding: 5px 12px; font-size: 11px; color: #50c878;
  }
  .msg-damage {
    align-self: center; background: #1a0808; border: 1px solid #3a1818;
    border-radius: 4px; padding: 4px 12px; font-size: 11px; color: #e05050;
  }

  /* ═══ 底部旁白气泡 (绿框) ═══ */
  #narration-bar {
    grid-column: 1 / 3; grid-row: 3;
    position: relative;
    background: var(--bubble-bg);
    border-top: 1px solid #2a2018;
    padding: 12px 20px;
    min-height: 52px;
    display: flex; align-items: flex-start; gap: 10px;
    z-index: 5;
  }
  #narration-bar::before {
    content: '';
    position: absolute; top: -8px; left: 40px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 8px solid var(--bubble-bg);
  }
  #narration-quote {
    width: 2px; min-height: 28px; background: #3a2818;
    flex-shrink: 0; margin-top: 2px;
  }
  #narration-text {
    font-size: 13px; line-height: 1.8; color: #c8b898;
    flex: 1;
  }
  #narration-speaker {
    font-size: 10px; color: #665; flex-shrink: 0;
    writing-mode: vertical-rl; letter-spacing: 2px;
  }

  /* ═══ 右侧上：角色面板 (黄框·不改) ═══ */
  #sidebar {
    grid-column: 3; grid-row: 2;
    background: var(--panel); padding: 10px 12px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    border-bottom: 1px solid #1a1a1a;
  }
  .char-card {
    background: #141414; border: 1px solid var(--border);
    padding: 8px 10px; transition: border-color 0.3s;
  }
  .char-card.active { border-color: var(--accent); }
  .char-name { font-size: 12px; font-weight: bold; margin-bottom: 5px; letter-spacing: 1px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 1px; }
  .stat-label { color: #666; }
  .stat-bar-bg { height: 4px; background: #1a1a1a; border-radius: 2px; margin-bottom: 3px; overflow: hidden; }
  .stat-bar-fg { height: 100%; border-radius: 2px; transition: width 0.5s, background 0.5s; }
  .hp-bar { background: #8b0000; }
  .san-bar { background: #3a6090; }
  .luck-bar { background: #6a5a30; }
  .inv-list { font-size: 9px; color: #665; margin-top: 3px; line-height: 1.4; }
  .conditions { font-size: 9px; color: #c0392b; }

  /* ═══ 右侧下：骰子/日志面板 (蓝框) ═══ */
  #dice-log {
    grid-column: 3; grid-row: 3;
    background: #0a0a0a; border-top: 1px solid #1a1a1a;
    padding: 8px 12px; overflow-y: auto;
    font-size: 10px; color: #554;
    display: flex; flex-direction: column; gap: 4px;
    max-height: 120px;
  }
  #dice-log .log-entry {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 0; border-bottom: 1px solid #141414;
    animation: fadeIn 0.4s ease;
  }
  #dice-log .log-icon { font-size: 14px; flex-shrink: 0; }
  #dice-log .log-speaker { color: #8a7a50; font-size: 10px; min-width: 36px; }
  #dice-log .log-detail { color: #777; flex: 1; }
  #dice-log .log-result {
    font-weight: bold; font-size: 12px;
    padding: 1px 6px; border-radius: 2px;
  }
  .log-result.success { color: #50c878; }
  .log-result.fail { color: #c0392b; }

  /* ═══ 进度条 ═══ */
  #progress {
    grid-column: 1 / -1; grid-row: 4;
    height: 2px; background: #1a1a1a;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  }
  #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
</style>
</head>
<body>

<!-- 顶部控制 -->
<div id="controls">
  <button id="btn-start" onclick="startGame()">▶ 开始跑团</button>
  <label>Host</label><input id="ollama-host" value="http://192.168.0.107:11434" style="width:180px">
  <label>KP</label><select id="kp-model"><option>gemma4:12b</option></select>
  <label>玩家</label><select id="player-model"><option>ornith:9b</option></select>
  <label>轮</label><input id="turns" type="number" value="12" min="3" max="30" style="width:40px">
  <label>种子</label><input id="seed" placeholder="随机" style="width:45px">
  <span id="status">就绪</span>
</div>

<!-- 左侧：场景背景 (红框) -->
<div id="scene">
  <img id="scene-img" src="" alt="">
  <div id="scene-label">—</div>
  <div id="scene-mood">—</div>
</div>

<!-- 中间：叙事区 -->
<div id="narrative">
  <div id="room-header">
    📍 <span id="room-name">—</span>
    🎒 <span id="room-items">—</span>
  </div>
  <div id="chat">
    <div style="text-align:center;color:#444;margin-top:80px;font-size:13px;">
      点击「开始跑团」<br>
      <span style="font-size:11px;color:#333;">程序化地图 · 物品收集 · Roguelike</span>
    </div>
  </div>
</div>

<!-- 右侧上：角色面板 (黄框·不改) -->
<div id="sidebar">
  <div class="char-card" id="card-陈明">
    <div class="char-name" style="color:#4a90d9">🕵️ 陈明</div>
    <div class="stat-row"><span class="stat-label">生命</span><span id="hp-陈明">12/12</span></div>
    <div class="stat-bar-bg"><div class="stat-bar-fg hp-bar" id="hpbar-陈明" style="width:100%"></div></div>
    <div class="stat-row"><span class="stat-label">理智</span><span id="san-陈明">60/60</span></div>
    <div class="stat-bar-bg"><div class="stat-bar-fg san-bar" id="sanbar-陈明" style="width:100%"></div></div>
    <div class="stat-row"><span class="stat-label">幸运</span><span id="luck-陈明">50</span></div>
    <div class="stat-bar-bg"><div class="stat-bar-fg luck-bar" id="luckbar-陈明" style="width:100%"></div></div>
    <div class="inv-list" id="inv-陈明">🎒 手电筒·警徽·.38左轮</div>
    <div class="conditions" id="cond-陈明"></div>
  </div>
  <div class="char-card" id="card-林晓">
    <div class="char-name" style="color:#50c878">🔬 林晓</div>
    <div class="stat-row"><span class="stat-label">生命</span><span id="hp-林晓">10/10</span></div>
    <div class="stat-bar-bg"><div class="stat-bar-fg hp-bar" id="hpbar-林晓" style="width:100%"></div></div>
    <div class="stat-row"><span class="stat-label">理智</span><span id="san-林晓">70/70</span></div>
    <div class="stat-bar-bg"><div class="stat-bar-fg san-bar" id="sanbar-林晓" style="width:100%"></div></div>
    <div class="stat-row"><span class="stat-label">幸运</span><span id="luck-林晓">45</span></div>
    <div class="stat-bar-bg"><div class="stat-bar-fg luck-bar" id="luckbar-林晓" style="width:100%"></div></div>
    <div class="inv-list" id="inv-林晓">🎒 急救包·笔记本·相机</div>
    <div class="conditions" id="cond-林晓"></div>
  </div>
  <div class="char-card" id="card-王刚">
    <div class="char-name" style="color:#e07050">💪 王刚</div>
    <div class="stat-row"><span class="stat-label">生命</span><span id="hp-王刚">15/15</span></div>
    <div class="stat-bar-bg"><div class="stat-bar-fg hp-bar" id="hpbar-王刚" style="width:100%"></div></div>
    <div class="stat-row"><span class="stat-label">理智</span><span id="san-王刚">40/40</span></div>
    <div class="stat-bar-bg"><div class="stat-bar-fg san-bar" id="sanbar-王刚" style="width:100%"></div></div>
    <div class="stat-row"><span class="stat-label">幸运</span><span id="luck-王刚">55</span></div>
    <div class="stat-bar-bg"><div class="stat-bar-fg luck-bar" id="luckbar-王刚" style="width:100%"></div></div>
    <div class="inv-list" id="inv-王刚">🎒 棒球棍·打火机·香烟</div>
    <div class="conditions" id="cond-王刚"></div>
  </div>
</div>

<!-- 底部旁白气泡 (绿框) -->
<div id="narration-bar">
  <div id="narration-quote"></div>
  <div id="narration-text"></div>
  <div id="narration-speaker"></div>
</div>

<!-- 右下骰子日志 (蓝框) -->
<div id="dice-log"></div>

<!-- 进度条 -->
<div id="progress"><div id="progress-bar"></div></div>

<script>
let es = null, totalTurns = 12, currentTurn = 0, gmap = null, tileGrid = null;
let streamTarget = null;

function startGame() {
  const btn = document.getElementById('btn-start');
  btn.disabled = true; btn.textContent = '⏳ 运行中...';
  document.getElementById('status').textContent = '生成地图...';
  document.getElementById('chat').innerHTML = '';
  document.getElementById('dice-log').innerHTML = '';
  document.getElementById('narration-text').textContent = '';
  document.getElementById('narration-speaker').textContent = '';
  document.getElementById('progress-bar').style.width = '0%';
  currentTurn = 0;
  totalTurns = parseInt(document.getElementById('turns').value) || 12;

  const params = new URLSearchParams({
    host: document.getElementById('ollama-host').value,
    kp: document.getElementById('kp-model').value,
    player: document.getElementById('player-model').value,
    turns: totalTurns,
    seed: document.getElementById('seed').value || '',
  });

  es = new EventSource('/api/stream?' + params);

  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    switch (d.type) {
      case 'status':
        document.getElementById('status').textContent = d.text;
        break;
      case 'map':
        gmap = d.map;
        tileGrid = d.grid;
        document.getElementById('scene-img').src = d.image || '';
        document.getElementById('scene-label').textContent = gmap.current_room_name || '';
        document.getElementById('status').textContent = '地图生成完成';
        break;
      case 'init':
        document.getElementById('status').textContent = '游戏开始';
        updateRoomInfo(d.room);
        break;
      case 'kp_stream_start':
        streamTarget = addMsg('kp', 'KP', '');
        break;
      case 'kp_token':
        if (streamTarget) appendToken(streamTarget, d.text);
        break;
      case 'kp_stream_end':
        if (d.state) updateState(d.state);
        currentTurn++;
        document.getElementById('progress-bar').style.width = (currentTurn/totalTurns*100)+'%';
        streamTarget = null;
        break;
      case 'player_stream_start':
        highlightCard(d.speaker);
        streamTarget = addMsg('player', d.speaker, '', d.color);
        break;
      case 'player_token':
        if (streamTarget) appendToken(streamTarget, d.text);
        break;
      case 'player_stream_end':
        streamTarget = null;
        break;
      case 'player_action':
        addMsg('player', d.speaker, d.text, d.color);
        highlightCard(d.speaker);
        break;
      case 'kp_narration':
        addMsg('kp', 'KP', d.text);
        currentTurn++;
        document.getElementById('progress-bar').style.width = (currentTurn/totalTurns*100)+'%';
        if (d.state) updateState(d.state);
        break;

      /* ── 骰子 → 蓝框日志 ── */
      case 'dice_roll':
        addDiceLog(d.speaker, d.text);
        break;

      case 'item_pickup':
        addMsg('item', '', '📦 ' + d.speaker + ' 获得: ' + d.items.join(', '));
        break;
      case 'damage':
        addMsg('damage', '', '💥 ' + d.speaker + ' 受到 ' + d.amount + ' 点伤害 (' + d.source + ')');
        break;
      case 'room_change':
        gmap = d.map;
        tileGrid = d.grid;
        if (gmap) gmap.current_room_id = d.room_id;
        document.getElementById('scene-img').src = d.image || '';
        document.getElementById('scene-label').textContent = d.room_name || '';
        updateRoomInfo({name: d.room_name, desc: d.room_desc, items: d.items});
        addMsg('system', '', '📍 进入 ' + d.room_name + ' — ' + d.room_desc);
        break;
      case 'done':
        addMsg('system', '', '📋 ' + d.summary.replace(/\\n/g, '<br>'));
        document.getElementById('status').textContent = '完成 ✓';
        resetBtn();
        break;
    }
  };
  es.onerror = () => { document.getElementById('status').textContent = '连接断开'; resetBtn(); };
}

function resetBtn() {
  const btn = document.getElementById('btn-start');
  btn.disabled = false; btn.textContent = '▶ 重新开始';
  if (es) es.close();
}

/* ── 消息 ── */
function addMsg(type, speaker, text, color) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg msg-' + type;
  if (color) div.style.setProperty('--player-color', color);
  const hdr = speaker ? `<div class="msg-header">${speaker}</div>` : '';
  div.innerHTML = hdr + `<div class="msg-body">${text}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  // 同时更新底部旁白气泡 (KP消息)
  if (type === 'kp' && text) {
    document.getElementById('narration-text').textContent = text;
    document.getElementById('narration-speaker').textContent = speaker;
  }
  return div;
}

function appendToken(div, text) {
  const body = div.querySelector('.msg-body');
  if (body) {
    body.textContent += text;
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
    // 实时更新旁白气泡
    document.getElementById('narration-text').textContent = body.textContent;
  }
}

/* ── 骰子日志 (蓝框) ── */
function addDiceLog(speaker, text) {
  const log = document.getElementById('dice-log');
  const entry = document.createElement('div');
  entry.className = 'log-entry';

  // 解析 "检定: 技能 值 → 值 结果" 格式
  const icon = text.includes('失败') ? '❌' : text.includes('成功') ? '✅' : '🎲';
  const resultClass = text.includes('失败') ? 'fail' :
                      text.includes('成功') || text.includes('通过') ? 'success' : '';

  entry.innerHTML = `
    <span class="log-icon">${icon}</span>
    <span class="log-speaker">${speaker}</span>
    <span class="log-detail">${text}</span>
  `;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

/* ── 角色高亮 ── */
function highlightCard(name) {
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + name);
  if (card) card.classList.add('active');
}

/* ── 状态更新 ── */
function updateState(state) {
  for (const [name, s] of Object.entries(state)) {
    const hpEl = document.getElementById('hp-' + name);
    const sanEl = document.getElementById('san-' + name);
    const luckEl = document.getElementById('luck-' + name);
    const hpBar = document.getElementById('hpbar-' + name);
    const sanBar = document.getElementById('sanbar-' + name);
    const luckBar = document.getElementById('luckbar-' + name);
    if (hpEl) hpEl.textContent = s.hp + '/' + s.max_hp;
    if (sanEl) sanEl.textContent = s.san + '/' + s.max_san;
    if (luckEl) luckEl.textContent = s.luck;
    if (hpBar) {
      const pct = s.hp / s.max_hp * 100;
      hpBar.style.width = pct + '%';
      hpBar.style.background = pct > 50 ? '#8b0000' : pct > 25 ? '#a06020' : '#c0392b';
    }
    if (sanBar) sanBar.style.width = (s.san / s.max_san * 100) + '%';
    if (luckBar) luckBar.style.width = (s.luck / 99 * 100) + '%';
    const invEl = document.getElementById('inv-' + name);
    if (invEl && s.inventory && s.inventory.length > 0) {
      invEl.innerHTML = '🎒 ' + s.inventory.join(' · ');
    }
    const condEl = document.getElementById('cond-' + name);
    if (condEl && s.conditions && s.conditions.length > 0) {
      condEl.textContent = '⚠ ' + s.conditions.join(', ');
    }
  }
}

function updateRoomInfo(room) {
  document.getElementById('room-name').textContent = room.name || '—';
  document.getElementById('room-items').textContent = (room.items && room.items.length > 0)
    ? room.items.join(', ') : '—';
}
</script>
</body>
</html>

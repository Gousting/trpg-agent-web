<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRPG Roguelike 跑团</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #0d0d0d;
    --border: #1a1a1a;
    --text: #b0a89a;
    --text-dim: #665;
    --accent: #8b0000;
    --gold: #8a7a50;
    --player-blue: #4a90d9;
    --player-green: #50c878;
    --player-orange: #e07050;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #000;
    color: var(--text);
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif;
    height: 100vh; display: grid;
    grid-template-columns: 78fr 22fr;
    grid-template-rows: 36px 1fr;
    overflow: hidden;
  }

  /* ═══ 顶部控制栏 ═══ */
  #controls {
    grid-column: 1 / -1; grid-row: 1;
    background: #0d0d0d; border-bottom: 1px solid #1a1a1a;
    padding: 0 12px; display: flex; align-items: center; gap: 8px;
    font-size: 11px; z-index: 10;
  }
  #controls button {
    background: var(--accent); color: #ddd; border: none;
    padding: 4px 14px; font-size: 11px; cursor: pointer;
    font-family: inherit; letter-spacing: 1px;
  }
  #controls button:disabled { opacity: 0.35; }
  #controls label { color: #555; font-size: 10px; }
  #controls input, #controls select {
    background: #1a1a1a; border: 1px solid #222; color: #999;
    padding: 3px 6px; font-size: 10px; font-family: inherit;
  }
  #status { font-size: 10px; color: #555; margin-left: auto; }

  /* 直播模式：隐藏控制栏配置项 */
  body.live #controls { padding: 2px 12px; min-height: 20px; }
  body.live #controls label,
  body.live #controls input,
  body.live #controls select,
  body.live #controls button { display: none; }
  body.live #controls #status { font-size: 9px; margin-left: 0; }

  /* ═══ 投票条（悬浮） ═══ */
  #vote-bar {
    position: fixed; top: 36px; left: 0; right: 0; z-index: 15;
    background: rgba(10,8,6,0.94); border-bottom: 1px solid #2a2018;
    padding: 8px 20px; display: none; align-items: center; gap: 20px;
    font-size: 11px; backdrop-filter: blur(4px);
  }
  #vote-bar.active { display: flex; }
  #vote-bar .vote-title {
    color: #8a7a50; font-size: 10px; letter-spacing: 2px;
    flex-shrink: 0; white-space: nowrap;
  }
  .vote-option {
    display: flex; align-items: center; gap: 8px;
    flex: 1; min-width: 140px; max-width: 280px;
    background: #141414; border: 1px solid #1f1f1f;
    border-radius: 3px; padding: 6px 10px;
    cursor: pointer; transition: border-color 0.2s;
  }
  .vote-option:hover { border-color: #3a3020; }
  .vote-option.voted { border-color: var(--accent); background: #1a1010; }
  .vote-option .vote-label { color: #888; font-size: 10px; white-space: nowrap; flex-shrink: 0; min-width: 56px; }
  .vote-option .vote-bar-wrap { flex: 1; height: 12px; background: #1a1a1a; border-radius: 2px; overflow: hidden; }
  .vote-option .vote-bar-fill {
    height: 100%; background: linear-gradient(90deg, #4a3020, #8a5a30);
    border-radius: 2px; transition: width 0.6s ease; min-width: 2px;
  }
  .vote-option .vote-pct { color: #8a7a50; font-size: 10px; font-weight: bold; min-width: 32px; text-align: right; flex-shrink: 0; }
  .vote-option .vote-count { color: #555; font-size: 9px; min-width: 24px; text-align: right; flex-shrink: 0; }
  .vote-option.leading .vote-bar-fill { background: linear-gradient(90deg, #6a2000, #b84020); }
  .vote-option.leading .vote-pct { color: #c06040; }

  /* ═══ 左侧：场景 ═══ */
  #scene {
    grid-column: 1; grid-row: 2;
    position: relative; background: #080808;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; border-right: 1px solid #1a1a1a;
  }
  #scene-img {
    width: 100%; height: 100%; object-fit: cover;
    filter: sepia(0.15) brightness(0.7) saturate(0.6);
  }
  #scene-label {
    position: absolute; bottom: 12px; left: 16px;
    font-size: 11px; color: #665; letter-spacing: 2px;
  }
  #scene-mood {
    position: absolute; bottom: 12px; right: 16px;
    font-size: 10px; color: #554;
    display: flex; align-items: center; gap: 4px;
  }
  #scene-mood::before {
    content: ''; display: inline-block;
    width: 5px; height: 5px; background: #8b0000; border-radius: 50%;
  }

  /* 骰子蒙版 — 激活时压暗背景 */
  #dice-mask {
    position: absolute; inset: 0; z-index: 4;
    background: rgba(0,0,0,0);
    pointer-events: none;
    transition: background 0.4s ease;
  }
  #dice-mask.show { background: rgba(0,0,0,0.55); }

  /* 骰子叠加层 */
  #dice-overlay {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    display: none; flex-direction: column; align-items: center; gap: 4px;
    pointer-events: none; z-index: 5;
  }
  #dice-overlay.show { display: flex; animation: dicePop 0.4s ease-out; }
  @keyframes dicePop {
    from { transform: translate(-50%,-50%) scale(0.5); opacity: 0; }
    to { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  }
  #dice-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(100,20,20,0.2); border: 2px solid rgba(160,40,40,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: bold; color: #d44;
    text-shadow: 0 0 20px rgba(200,0,0,0.4);
  }
  #dice-skill {
    font-size: 12px; color: #c88; letter-spacing: 1px;
    background: rgba(0,0,0,0.6); padding: 2px 10px; border-radius: 2px;
  }

  /* ═══ 右侧：合并面板 ═══ */
  #right-panel {
    grid-column: 2; grid-row: 2;
    background: var(--panel);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* 角色卡区 */
  #characters {
    flex-shrink: 0;
    border-bottom: 1px solid #1a1a1a;
    padding: 8px 10px;
  }
  #characters h2 {
    font-size: 9px; color: #665; letter-spacing: 3px;
    margin-bottom: 6px; font-weight: normal;
  }
  .char-card {
    background: #111; border: 1px solid #1f1f1f;
    padding: 4px 8px; margin-bottom: 3px;
    transition: border-color 0.3s;
  }
  .char-card.active { border-color: var(--accent); }
  .char-name { font-size: 10px; font-weight: bold; margin-bottom: 2px; letter-spacing: 1px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 8px; margin-bottom: 0; }
  .stat-label { color: #555; }
  .stat-bar-bg { height: 2px; background: #1a1a1a; border-radius: 1px; margin-bottom: 2px; overflow: hidden; }
  .stat-bar-fg { height: 100%; border-radius: 1px; transition: width 0.5s, background 0.5s; }
  .hp-bar { background: #6a2020; }
  .san-bar { background: #2a4060; }
  .luck-bar { background: #4a3a20; }
  .inv-list { font-size: 8px; color: #665; margin-top: 2px; line-height: 1.3; }
  .conditions { font-size: 8px; color: #c0392b; }

  /* 行动日志区 */
  #action-log {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  #action-log h2 {
    font-size: 10px; color: #444; letter-spacing: 3px;
    margin-bottom: 4px; font-weight: normal; flex-shrink: 0;
  }
  .log-msg { font-size: 10.5px; line-height: 1.6; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .log-msg .speaker { color: #8a7a50; font-weight: bold; margin-right: 4px; }
  .log-msg.kp { color: #999; border-left: 2px solid #2a2018; padding-left: 8px; }
  .log-msg.player { color: #aaa; padding: 2px 0; }
  .log-msg.system { color: #554; text-align: center; font-size: 9px; }
  .log-msg.dice { color: #e05050; text-align: center; font-size: 10px; }
  .log-msg.dice.success { color: #50c878; }
  .log-msg.item { color: #50c878; text-align: center; font-size: 10px; }
  .log-msg.damage { color: #e05050; text-align: center; font-size: 10px; }

  /* 进度条 */
  #progress {
    position: fixed; bottom: 0; left: 0; right: 0; height: 2px;
    background: #1a1a1a; z-index: 20;
  }
  #progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
</style>
</head>
<body>

<!-- 顶部控制 -->
<div id="controls">
  <button id="btn-start" onclick="startGame()">▶ 开始跑团</button>
  <label>Host</label><input id="ollama-host" value="http://localhost:11434" style="width:180px">
  <label>KP</label><select id="kp-model"><option>gemma4:12b</option></select>
  <label>玩家</label><select id="player-model"><option>ornith:9b</option></select>
  <label>轮</label><input id="turns" type="number" value="12" min="3" max="30" style="width:40px">
  <label>种子</label><input id="seed" placeholder="随机" style="width:45px">
  <span id="status">就绪</span>
</div>

<!-- 投票条 -->
<div id="vote-bar"></div>

<!-- 左侧：场景 -->
<div id="scene">
  <img id="scene-img" src="" alt="">
  <div id="scene-label">—</div>
  <div id="scene-mood">—</div>
  <div id="dice-mask"></div>
  <div id="dice-overlay">
    <div id="dice-circle">—</div>
    <div id="dice-skill"></div>
  </div>
</div>

<!-- 右侧：合并面板 -->
<div id="right-panel">
  <!-- 角色卡 -->
  <div id="characters">
    <h2>调查员档案</h2>
    <div class="char-card" id="card-陈明">
      <div class="char-name" style="color:#4a90d9">🕵️ 陈明</div>
      <div class="stat-row"><span class="stat-label">HP</span><span id="hp-陈明">12/12</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fg hp-bar" id="hpbar-陈明" style="width:100%"></div></div>
      <div class="stat-row"><span class="stat-label">SAN</span><span id="san-陈明">60/60</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fg san-bar" id="sanbar-陈明" style="width:100%"></div></div>
      <div class="stat-row"><span class="stat-label">LUCK</span><span id="luck-陈明">50</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fg luck-bar" id="luckbar-陈明" style="width:100%"></div></div>
      <div class="inv-list" id="inv-陈明">🎒 手电筒·警徽·.38左轮</div>
      <div class="conditions" id="cond-陈明"></div>
    </div>
    <div class="char-card" id="card-林晓">
      <div class="char-name" style="color:#50c878">🔬 林晓</div>
      <div class="stat-row"><span class="stat-label">HP</span><span id="hp-林晓">10/10</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fg hp-bar" id="hpbar-林晓" style="width:100%"></div></div>
      <div class="stat-row"><span class="stat-label">SAN</span><span id="san-林晓">70/70</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fg san-bar" id="sanbar-林晓" style="width:100%"></div></div>
      <div class="stat-row"><span class="stat-label">LUCK</span><span id="luck-林晓">45</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fg luck-bar" id="luckbar-林晓" style="width:100%"></div></div>
      <div class="inv-list" id="inv-林晓">🎒 急救包·笔记本·相机</div>
      <div class="conditions" id="cond-林晓"></div>
    </div>
    <div class="char-card" id="card-王刚">
      <div class="char-name" style="color:#e07050">💪 王刚</div>
      <div class="stat-row"><span class="stat-label">HP</span><span id="hp-王刚">15/15</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fg hp-bar" id="hpbar-王刚" style="width:100%"></div></div>
      <div class="stat-row"><span class="stat-label">SAN</span><span id="san-王刚">40/40</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fg san-bar" id="sanbar-王刚" style="width:100%"></div></div>
      <div class="stat-row"><span class="stat-label">LUCK</span><span id="luck-王刚">55</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fg luck-bar" id="luckbar-王刚" style="width:100%"></div></div>
      <div class="inv-list" id="inv-王刚">🎒 棒球棍·打火机·香烟</div>
      <div class="conditions" id="cond-王刚"></div>
    </div>
  </div>

  <!-- 行动日志 -->
  <div id="action-log">
    <h2>行动记录</h2>
    <div style="text-align:center;color:#333;margin-top:40px;font-size:12px;">点击「开始跑团」</div>
  </div>
</div>

<!-- 进度条 -->
<div id="progress"><div id="progress-bar"></div></div>

<script>
let es = null, totalTurns = 12, currentTurn = 0, gmap = null, tileGrid = null;
let streamTarget = null;

function startGame() {
  document.body.classList.add('live');
  const btn = document.getElementById('btn-start');
  btn.disabled = true; btn.textContent = '⏳ 运行中...';
  document.getElementById('status').textContent = '生成地图...';
  document.getElementById('action-log').innerHTML = '<h2>行动记录</h2>';
  document.getElementById('progress-bar').style.width = '0%';
  hideVote();
  hideDice();
  currentTurn = 0;
  totalTurns = parseInt(document.getElementById('turns').value) || 12;

  const params = new URLSearchParams({
    host: document.getElementById('ollama-host').value,
    kp: document.getElementById('kp-model').value,
    player: document.getElementById('player-model').value,
    turns: totalTurns,
    seed: document.getElementById('seed').value || '',
  });

  es = new EventSource('/api/stream?' + params);

  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    switch (d.type) {
      case 'status':
        document.getElementById('status').textContent = d.text;
        break;
      case 'map':
        gmap = d.map;
        tileGrid = d.grid;
        document.getElementById('scene-img').src = d.image || '';
        document.getElementById('scene-label').textContent = gmap.current_room_name || '';
        document.getElementById('status').textContent = '地图生成完成';
        break;
      case 'init':
        document.getElementById('status').textContent = '游戏开始';
        break;
      case 'kp_stream_start':
        streamTarget = addLog('kp', 'KP', '');
        break;
      case 'kp_token':
        if (streamTarget) { streamTarget.textContent += d.text; scrollLog(); }
        break;
      case 'kp_stream_end':
        if (d.state) updateState(d.state);
        currentTurn++;
        document.getElementById('progress-bar').style.width = (currentTurn/totalTurns*100)+'%';
        streamTarget = null;
        break;
      case 'player_stream_start':
        highlightCard(d.speaker);
        streamTarget = addLog('player', d.speaker, '', d.color);
        break;
      case 'player_token':
        if (streamTarget) { streamTarget.querySelector('.text').textContent += d.text; scrollLog(); }
        break;
      case 'player_stream_end':
        streamTarget = null;
        break;
      case 'player_action':
        addLog('player', d.speaker, d.text, d.color);
        highlightCard(d.speaker);
        break;
      case 'kp_narration':
        addLog('kp', 'KP', d.text);
        currentTurn++;
        document.getElementById('progress-bar').style.width = (currentTurn/totalTurns*100)+'%';
        if (d.state) updateState(d.state);
        break;
      case 'dice_roll':
        addLog('dice', d.speaker, d.text);
        showDiceOverlay(d);
        break;
      case 'item_pickup':
        addLog('item', '', '📦 ' + d.speaker + ' 获得: ' + d.items.join(', '));
        break;
      case 'damage':
        addLog('damage', '', '💥 ' + d.speaker + ' 受到 ' + d.amount + ' 点伤害 (' + d.source + ')');
        break;
      case 'room_change':
        gmap = d.map;
        tileGrid = d.grid;
        if (gmap) gmap.current_room_id = d.room_id;
        document.getElementById('scene-img').src = d.image || '';
        document.getElementById('scene-label').textContent = d.room_name || '';
        addLog('system', '', '📍 进入 ' + d.room_name + ' — ' + d.room_desc);
        break;
      case 'vote_start':
        renderVote(d.title || '投票', d.options);
        break;
      case 'vote_update':
        updateVote(d.counts);
        break;
      case 'vote_end':
        hideVote();
        break;
      case 'done':
        addLog('system', '', '📋 ' + d.summary.replace(/\\n/g, '<br>'));
        document.getElementById('status').textContent = '完成 ✓';
        resetBtn();
        break;
    }
  };
  es.onerror = () => { document.getElementById('status').textContent = '连接断开'; resetBtn(); };
}

function resetBtn() {
  document.body.classList.remove('live');
  const btn = document.getElementById('btn-start');
  btn.disabled = false; btn.textContent = '▶ 重新开始';
  if (es) es.close();
}

/* ── 行动日志 ── */
function addLog(type, speaker, text, color) {
  const log = document.getElementById('action-log');
  const div = document.createElement('div');
  div.className = 'log-msg ' + type;
  if (type === 'player' && color) div.style.color = color;

  if (type === 'kp') {
    div.textContent = text;
  } else if (type === 'player') {
    div.innerHTML = `<span class="speaker" style="color:${color||'#aaa'}">${speaker}</span><span class="text">${text}</span>`;
  } else if (type === 'dice') {
    const cls = text.includes('失败') ? 'dice' : text.match(/成功|通过/) ? 'dice success' : 'dice';
    div.className = 'log-msg ' + cls;
    div.innerHTML = `🎲 <span class="speaker">${speaker}</span> ${text}`;
  } else {
    div.textContent = text;
  }
  log.appendChild(div);
  scrollLog();
  return div;
}

function scrollLog() {
  const log = document.getElementById('action-log');
  log.scrollTop = log.scrollHeight;
}

/* ── 骰子叠加层 ── */
function showDiceOverlay(d) {
  const overlay = document.getElementById('dice-overlay');
  const mask = document.getElementById('dice-mask');
  const match = d.text.match(/(\d+)/);
  document.getElementById('dice-circle').textContent = match ? match[1] : '—';
  document.getElementById('dice-skill').textContent = d.skill || d.text || '';
  overlay.classList.remove('show');
  mask.classList.remove('show');
  void overlay.offsetWidth;
  overlay.classList.add('show');
  mask.classList.add('show');
  setTimeout(() => { overlay.classList.remove('show'); mask.classList.remove('show'); }, 3000);
}

function hideDice() {
  document.getElementById('dice-overlay').classList.remove('show');
  document.getElementById('dice-mask').classList.remove('show');
}

/* ── 投票条 ── */
let voteChoices = [];

function renderVote(title, options) {
  const bar = document.getElementById('vote-bar');
  voteChoices = options.map(o => ({label: o, count: 0, pct: 0}));
  const total = options.length;
  const eq = Math.floor(100 / total);

  let html = `<span class="vote-title">⚡ ${title}</span>`;
  options.forEach((opt, i) => {
    html += `
      <div class="vote-option" data-idx="${i}" onclick="castVote(${i})">
        <span class="vote-label">${opt}</span>
        <div class="vote-bar-wrap">
          <div class="vote-bar-fill" style="width:${eq}%"></div>
        </div>
        <span class="vote-pct">${eq}%</span>
        <span class="vote-count">0</span>
      </div>`;
  });
  bar.innerHTML = html;
  bar.classList.add('active');
}

function castVote(idx) {
  const bar = document.getElementById('vote-bar');
  const opts = bar.querySelectorAll('.vote-option');
  opts.forEach((el, i) => el.classList.toggle('voted', i === idx));
}

function updateVote(counts) {
  const total = counts.reduce((a,b) => a+b, 0) || 1;
  const max = Math.max(...counts);
  const bar = document.getElementById('vote-bar');
  const opts = bar.querySelectorAll('.vote-option');
  opts.forEach((el, i) => {
    const pct = Math.round(counts[i] / total * 100);
    el.querySelector('.vote-bar-fill').style.width = pct + '%';
    el.querySelector('.vote-pct').textContent = pct + '%';
    el.querySelector('.vote-count').textContent = counts[i];
    el.classList.toggle('leading', counts[i] === max && max > 0);
  });
}

function hideVote() {
  const bar = document.getElementById('vote-bar');
  bar.classList.remove('active');
  bar.innerHTML = '';
  voteChoices = [];
}

/* ── 角色高亮 ── */
function highlightCard(name) {
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + name);
  if (card) card.classList.add('active');
}

/* ── 状态更新 ── */
function updateState(state) {
  for (const [name, s] of Object.entries(state)) {
    const hpEl = document.getElementById('hp-' + name);
    const sanEl = document.getElementById('san-' + name);
    const luckEl = document.getElementById('luck-' + name);
    const hpBar = document.getElementById('hpbar-' + name);
    const sanBar = document.getElementById('sanbar-' + name);
    const luckBar = document.getElementById('luckbar-' + name);
    if (hpEl) hpEl.textContent = s.hp + '/' + s.max_hp;
    if (sanEl) sanEl.textContent = s.san + '/' + s.max_san;
    if (luckEl) luckEl.textContent = s.luck;
    if (hpBar) {
      const pct = s.hp / s.max_hp * 100;
      hpBar.style.width = pct + '%';
      hpBar.style.background = pct > 50 ? '#8b0000' : pct > 25 ? '#a06020' : '#c0392b';
    }
    if (sanBar) sanBar.style.width = (s.san / s.max_san * 100) + '%';
    if (luckBar) luckBar.style.width = (s.luck / 99 * 100) + '%';
    const invEl = document.getElementById('inv-' + name);
    if (invEl && s.inventory && s.inventory.length > 0) {
      invEl.innerHTML = '🎒 ' + s.inventory.join(' · ');
    }
    const condEl = document.getElementById('cond-' + name);
    if (condEl && s.conditions && s.conditions.length > 0) {
      condEl.textContent = '⚠ ' + s.conditions.join(', ');
    }
  }
}
</script>
</body>
</html>
